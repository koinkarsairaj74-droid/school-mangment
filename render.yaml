# Campus ERP — Render Blueprint (PREVIEW ONLY)
# This is a configuration template, not an active deployment.
# Production deployment is deliberately gated on committed migrations and passing tests.
services:
  - type: web
    name: campus-erp-preview
    runtime: python
    rootDir: campus_erp
    branch: campus-erp-v1
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile -
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campus-erp-postgres
          property: connectionString
      - key: DJANGO_DEBUG
        value: "false"
      - key: ENABLE_HTTPS_REDIRECT
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.7"
databases:
  - name: campus-erp-postgres
    databaseName: campus_erp
    user: campus_erp
