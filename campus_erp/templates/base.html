<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>{% block title %}Campus ERP{% endblock %}</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#25344a;background:#f8fafc;font-size:14px}*{box-sizing:border-box}body{margin:0}.top{background:#fff;border-bottom:1px solid #e2e7ee;display:flex;align-items:center;gap:12px;padding:16px clamp(20px,4vw,60px)}.brand{width:37px;height:37px;border-radius:11px;background:#274b67;color:white;font-size:23px;font-family:Georgia,serif;display:grid;place-items:center}.top b{letter-spacing:-.02em}.top small{display:block;color:#789;font-size:10px;margin-top:2px}.top form{margin-left:auto}button,.button{cursor:pointer;background:#2b506d;color:#fff;padding:11px 15px;border:0;border-radius:9px;font-weight:750;font:inherit}button:hover{background:#406b8a}main{width:min(1100px,calc(100% - 32px));margin:38px auto}.eyebrow{text-transform:uppercase;color:#667b90;font-size:10px;font-weight:800;letter-spacing:.12em}h1{font-size:clamp(26px,3vw,39px);letter-spacing:-.055em;margin:8px 0}h2{font-size:18px;letter-spacing:-.02em}p{line-height:1.6;color:#728095}.card{border:1px solid #e3e9ef;background:white;border-radius:13px;padding:23px;box-shadow:0 10px 30px #1a324508}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:20px 0}.kpi{padding:19px;background:white;border:1px solid #e3e9ee;border-radius:12px}.kpi small{display:block;color:#718294;font-size:11px}.kpi b{font-size:25px;display:block;margin:8px 0}.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.module{border:1px solid #e3e9ef;background:white;border-radius:12px;padding:21px}.module h2{margin:0}.module a{display:inline-block;margin-top:12px;color:#285e84;font-weight:750;text-decoration:none}.module p{font-size:12px;margin-bottom:0}.note{background:#eef4f8;border:1px solid #dbe7ee;color:#50697d;padding:13px;border-radius:9px;margin-top:20px;font-size:12px}label{display:block;font-size:12px;font-weight:750;margin:15px 0 6px}input{width:100%;padding:12px 13px;border:1px solid #d7e0e8;border-radius:9px;outline:0;font:inherit}input:focus{border-color:#6f99b5;box-shadow:0 0 0 3px #6f99b51c}.alert{color:#ac3547;padding:11px;border-radius:9px;background:#fff1f2;font-size:12px}.center{width:min(450px,calc(100% - 36px));margin:65px auto}.center h1{font-size:28px}.center button{margin-top:19px;width:100%}@media(max-width:700px){.modules,.kpis{grid-template-columns:1fr}.top{padding:13px 16px}main{margin:20px auto}}
</style></head><body><header class="top"><span class="brand">C</span><div><b>{% if school %}{{ school.name }}{% else %}Campus ERP{% endif %}</b><small>School management platform</small></div>{% if request.user.is_authenticated %}<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Sign out</button></form>{% endif %}</header>{% block content %}{% endblock %}</body></html>
