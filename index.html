<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAV SMS | School Management</title><meta name="description" content="LAV SMS school management dashboard demo"><style>
:root{--bg:#f4f6fc;--ink:#17223b;--muted:#78839a;--line:#e5eaf4;--card:rgba(255,255,255,.8);--blue:#5669e8;--purple:#8e62ee;--shadow:0 14px 40px #243d7010}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#e0e8ff,transparent 37%),radial-gradient(ellipse at 90% 12%,#f0e4ff,transparent 32%),var(--bg);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:238px 1fr}.sidebar{padding:23px 15px;background:#ffffff86;border-right:1px solid #ffffffd9;backdrop-filter:blur(24px)}.brand{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:850;padding:0 8px 28px}.logo{width:42px;height:42px;display:grid;place-items:center;color:#fff;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 7px 18px #5669e844}.navtitle{font-size:10px;letter-spacing:.14em;color:#98a1b2;font-weight:800;margin:19px 10px 8px}.nav{width:100%;border:0;background:transparent;color:#65718a;display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:13px;text-align:left;margin:2px 0}.nav .ico{width:21px;text-align:center;font-size:16px}.nav:hover,.nav.active{background:#e9edff;color:#4558d8;font-weight:750}.main{width:100%;max-width:1500px;margin:auto;padding:27px clamp(15px,3.5vw,42px)}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:24px}.eyebrow{color:var(--muted);font-size:11px;font-weight:650}.top h1{font-size:clamp(25px,3vw,34px);letter-spacing:-.045em;margin:2px 0}.tools{display:flex;gap:9px;align-items:center}.search{width:190px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#ffffffa8;outline:none}.avatar{height:39px;width:39px;border-radius:13px;background:#e2e8ff;color:#4b5ed1;display:grid;place-items:center;font-weight:800}.glass{background:var(--card);border:1px solid #ffffffed;border-radius:21px;box-shadow:var(--shadow);backdrop-filter:blur(22px)}.welcome{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:25px 28px;background:linear-gradient(110deg,#ffffffdc,#f2edffca);margin-bottom:22px}.welcome h2{font-size:24px;margin:5px 0;letter-spacing:-.035em}.welcome p{margin:0;color:var(--muted)}.cap{font-size:43px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:25px 0 13px}.sectionhead h2{font-size:17px;margin:0}.sectionhead small{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.stat{padding:18px}.statlabel{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.staticon{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:#edf0ff;font-size:17px}.num{font-size:28px;font-weight:850;letter-spacing:-.04em;margin:12px 0 2px}.sub{font-size:11px;color:#31846b}.twocol{display:grid;grid-template-columns:1.15fr .85fr;gap:15px}.panel{padding:20px}.quickgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.quick{border:1px solid var(--line);border-radius:14px;background:#ffffffa6;display:flex;gap:11px;align-items:center;text-align:left;padding:13px;color:var(--ink)}.quick:hover{background:white;border-color:#b9c5ff;transform:translateY(-1px)}.qico{width:36px;height:36px;border-radius:11px;background:#edf0ff;display:grid;place-items:center;flex-shrink:0}.quick b{display:block;font-size:12px}.quick small{color:var(--muted);font-size:10px}.event{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.event:last-child{border:0}.date{background:#edf0ff;color:#4d60d2;border-radius:10px;min-width:45px;padding:6px;text-align:center;font-weight:800;font-size:11px}.event b{font-size:12px}.event small{display:block;color:var(--muted);font-size:11px}.assistant{margin-top:15px;padding:17px;display:flex;align-items:center;gap:12px;background:linear-gradient(110deg,#eff1ffdd,#f8efffdd)}.bot{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;color:white;background:linear-gradient(135deg,var(--blue),var(--purple));font-size:20px;flex-shrink:0}.assistant p{margin:3px 0 0;color:var(--muted);font-size:12px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:750;background:linear-gradient(135deg,var(--blue),var(--purple));color:white}.btn.secondary{background:#eef0ff;color:#4b5fd0}.assistant .btn{margin-left:auto;white-space:nowrap}.notice{color:var(--muted);font-size:11px;margin:17px 2px}.tablewrap{overflow:auto}.data{width:100%;border-collapse:collapse;margin-top:8px}.data th,.data td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}.data th{color:var(--muted);font-weight:700}.badge{background:#e5f7ef;color:#19805c;padding:4px 8px;border-radius:20px;font-size:10px}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px}.empty{padding:28px;text-align:center;color:var(--muted)}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}.field label{font-size:12px;color:var(--muted)}.field input,.field select{padding:11px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);width:100%}.overlay{position:fixed;inset:0;background:#18233b75;display:none;place-items:center;padding:16px;z-index:5}.modal{background:#fdfdff;border:1px solid white;border-radius:20px;padding:22px;width:min(500px,100%);box-shadow:0 24px 90px #101a3544}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0;font-size:20px}.x{border:0;background:#eef0f7;border-radius:10px;padding:7px 10px}.footrow{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.hide{display:none!important}
body.dark{--bg:#101526;--ink:#eef1ff;--muted:#a0aac1;--line:#303a53;--card:rgba(27,35,57,.84);--shadow:0 14px 40px #0003;background:radial-gradient(ellipse at 10% 0%,#29365d,transparent 37%),#101526;color:var(--ink)}body.dark .sidebar{background:#151d30bd;border-color:#303a53}body.dark .nav{color:#a0aac1}body.dark .nav.active{background:#29335d;color:#cbd2ff}body.dark .welcome,body.dark .assistant{background:linear-gradient(110deg,#202a46,#2b2342)}body.dark .search,body.dark .pill,body.dark .quick,body.dark .field input,body.dark .field select{background:#202941;color:var(--ink);border-color:var(--line)}body.dark .modal{background:#171f32;color:var(--ink)}body.dark .x{background:#303a53;color:white}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.twocol{grid-template-columns:1fr}.layout{grid-template-columns:205px 1fr}.search{width:150px}}@media(max-width:650px){.layout{display:block}.sidebar{display:flex;overflow:auto;gap:4px;padding:9px;position:sticky;top:0;z-index:3}.brand,.navtitle{display:none}.nav{width:auto;min-width:max-content;padding:9px 11px}.nav .ico{width:auto}.main{padding:18px 12px}.top{align-items:flex-start}.search{width:120px}.welcome{padding:19px}.welcome h2{font-size:21px}.cap{font-size:33px}.stats{gap:9px}.stat{padding:13px}.num{font-size:24px}.panel{padding:14px}.quickgrid{grid-template-columns:1fr}.assistant{align-items:flex-start;flex-wrap:wrap}.assistant .btn{margin-left:54px}.formrow{grid-template-columns:1fr}}
</style></head><body>
<div class="layout"><aside class="sidebar"><div class="brand"><div class="logo">L</div><span>LAV <span style="color:#6878ed">SMS</span></span></div><div class="navtitle">WORKSPACE</div><button class="nav active" data-page="Overview"><span class="ico">▦</span>Overview</button><button class="nav" data-page="Students"><span class="ico">♙</span>Students</button><button class="nav" data-page="Teachers"><span class="ico">♧</span>Teachers</button><button class="nav" data-page="Classes"><span class="ico">▤</span>Classes & Sections</button><button class="nav" data-page="Attendance"><span class="ico">✓</span>Attendance</button><button class="nav" data-page="Timetable"><span class="ico">◷</span>Timetable</button><button class="nav" data-page="Exams & Marks"><span class="ico">✎</span>Exams & Marks</button><button class="nav" data-page="Fees"><span class="ico">₹</span>Fees</button><div class="navtitle">MANAGEMENT</div><button class="nav" data-page="Parents"><span class="ico">♧</span>Parents</button><button class="nav" data-page="Reports"><span class="ico">▥</span>Reports</button><button class="nav" data-page="Settings"><span class="ico">⚙</span>Settings</button></aside>
<main class="main"><header class="top"><div><div class="eyebrow">LAV SMS · SCHOOL MANAGEMENT</div><h1 id="pagetitle">School overview</h1></div><div class="tools"><input id="search" class="search" placeholder="⌕ Search demo..." aria-label="Search demo"><button id="theme" class="nav" style="width:auto;border:1px solid var(--line);margin:0" title="Toggle theme">☼</button><div class="avatar">SA</div></div></header><div id="content"></div><p class="notice">Interactive GitHub Pages demo · Demo entries save in this browser only and are not sent to a school server. Production login, shared records, and AI need the Laravel backend on PHP hosting.</p></main></div>
<div id="overlay" class="overlay"><div class="modal"><div class="modalhead"><h2 id="modalTitle">Add record</h2><button class="x" id="close">✕</button></div><form id="recordForm"><div id="formfields"></div><div class="footrow"><button type="button" class="btn secondary" id="cancel">Cancel</button><button class="btn" type="submit">Save demo record</button></div></form></div></div>
<script>
const sample={Students:[
{id:"STU001",admissionNo:"LAV-2026-001",name:"Aarav Patil",grade:"Grade 8",section:"A",parent:"Sanjay Patil",phone:"9000000001",email:"sanjay.patil@example.com",detail:"Grade 8 · A",status:"Active"},
{id:"STU002",admissionNo:"LAV-2026-002",name:"Ananya Shah",grade:"Grade 7",section:"B",parent:"Neha Shah",phone:"9000000002",email:"neha.shah@example.com",detail:"Grade 7 · B",status:"Active"},
{id:"STU003",admissionNo:"LAV-2026-003",name:"Vihaan Joshi",grade:"Grade 9",section:"A",parent:"Rohan Joshi",phone:"9000000003",email:"rohan.joshi@example.com",detail:"Grade 9 · A",status:"Active"}
],Teachers:[{name:"Mrs. Meera Kulkarni",detail:"Mathematics",status:"Active"},{name:"Mr. Rahul Deshmukh",detail:"Science",status:"Active"},{name:"Ms. Neha Shah",detail:"English",status:"Active"}],Classes:[{name:"Grade 8 · Section A",detail:"Class teacher: Mrs. Kulkarni",status:"Active"},{name:"Grade 9 · Section B",detail:"Class teacher: Mr. Deshmukh",status:"Active"}],Attendance:[{name:"Grade 8 · A",detail:"24 present · 2 absent",status:"Recorded"},{name:"Grade 9 · B",detail:"27 present · 1 absent",status:"Recorded"}],Timetable:[{name:"Mathematics",detail:"Grade 8 · 09:00 AM",status:"Scheduled"},{name:"Science",detail:"Grade 9 · 10:00 AM",status:"Scheduled"}],"Exams & Marks":[{name:"Monthly Assessment",detail:"All grades",status:"Upcoming"},{name:"Unit Test 2",detail:"Grade 8",status:"Upcoming"}],Fees:[{name:"Aarav Patil",detail:"Tuition · ₹12,000",status:"Pending"},{name:"Ananya Shah",detail:"Tuition · ₹12,000",status:"Paid"}],Parents:[{name:"Sanjay Patil",detail:"Parent of Aarav Patil",status:"Active"}],Reports:[{name:"Attendance summary",detail:"Monthly report",status:"Ready"},{name:"Fees overview",detail:"Term report",status:"Ready"}],Settings:[{name:"School profile",detail:"Configure school information on your live app",status:"Demo"}]};
const STORE_KEY="lavsms-demo-records";
function loadRecords(){
 try{
  const raw=localStorage.getItem(STORE_KEY);
  if(raw){
   const saved=JSON.parse(raw);
   const merged=Object.assign(JSON.parse(JSON.stringify(sample)),saved);
   merged.Students=(merged.Students||[]).map((s,i)=>{
    const parts=String(s.detail||"Grade 8 · A").split(" · ");
    return Object.assign({id:"stu-"+(i+1),admissionNo:"LAV-2026-"+String(i+1).padStart(3,"0"),name:"",grade:"Grade 8",section:"A",parent:"Not provided",phone:"",email:"",status:"Active"},s,{grade:s.grade||parts[0]||"Grade 8",section:s.section||parts[1]||"A"});
   });
   return merged;
  }
 }catch(err){console.warn("Could not read saved LAV SMS demo data",err);}
 return JSON.parse(JSON.stringify(sample));
}
let records=loadRecords(),page="Overview";
function saveRecords(){try{localStorage.setItem(STORE_KEY,JSON.stringify(records));return true;}catch(err){alert("This browser could not save the demo data. Try allowing site storage or using a normal browser window.");return false;}}
const $=id=>document.getElementById(id);
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(title,body){return '<section class="glass panel"><div class="sectionhead" style="margin-top:0"><h2>'+title+'</h2></div>'+body+'</section>'}
function overview(){return '<section class="glass welcome"><div><div class="eyebrow">YOUR SCHOOL AT A GLANCE</div><h2>Good day, Administrator 👋</h2><p>Explore your school dashboard and try the demo actions.</p></div><div class="cap">🎓</div></section><div class="sectionhead"><h2>School statistics</h2><small>Illustrative preview data</small></div><section class="stats"><div class="glass stat"><div class="statlabel">Total students <span class="staticon">♙</span></div><div class="num">'+records.Students.length+'</div><div class="sub">Demo student records</div></div><div class="glass stat"><div class="statlabel">Teaching staff <span class="staticon">♧</span></div><div class="num">'+records.Teachers.length+'</div><div class="sub">Demo teacher records</div></div><div class="glass stat"><div class="statlabel">Classes today <span class="staticon">▤</span></div><div class="num">'+records.Classes.length+'</div><div class="sub">Demo classes</div></div><div class="glass stat"><div class="statlabel">Fee records <span class="staticon">₹</span></div><div class="num">'+records.Fees.length+'</div><div class="sub">No real payments processed</div></div></section><div class="twocol"><div><div class="sectionhead"><h2>Quick actions</h2><small>Try the interface</small></div><section class="glass panel"><div class="quickgrid"><button class="quick" data-add="Students"><span class="qico">＋</span><span><b>Add a student</b><small>Try adding a demo record</small></span></button><button class="quick" data-page="Attendance"><span class="qico">✓</span><span><b>Take attendance</b><small>Open attendance section</small></span></button><button class="quick" data-page="Timetable"><span class="qico">◷</span><span><b>View timetable</b><small>Classes and schedule</small></span></button><button class="quick" data-page="Reports"><span class="qico">▥</span><span><b>View reports</b><small>Demo report list</small></span></button></div></section><section class="glass assistant"><div class="bot">✦</div><div><b>AI school assistant</b><p>Ask for a sample school admin tip.</p></div><button class="btn" id="askai">Try assistant</button></section></div><div><div class="sectionhead"><h2>Upcoming schedule</h2><small>Example events</small></div>'+card('School calendar','<div class="event"><div class="date">27<br>OCT</div><div><b>Faculty meeting</b><small>Staff room · 10:30 AM</small></div></div><div class="event"><div class="date">29<br>OCT</div><div><b>Monthly assessment</b><small>All classes · As scheduled</small></div></div><div class="event"><div class="date">02<br>NOV</div><div><b>Parent-teacher meeting</b><small>Main hall · 9:00 AM</small></div></div>')+'</div></div>'}
function studentPage(){
 let q=$("search").value.trim().toLowerCase();
 let arr=(records.Students||[]).filter(s=>[s.name,s.admissionNo,s.grade,s.section,s.parent,s.phone,s.email,s.status].join(" ").toLowerCase().includes(q));
 let rows=arr.map(s=>'<tr><td><b>'+escapeHtml(s.name)+'</b><small style="display:block;color:var(--muted)">'+escapeHtml(s.email||"No email added")+'</small></td><td>'+escapeHtml(s.admissionNo||"—")+'</td><td>'+escapeHtml(s.grade||"—")+' · '+escapeHtml(s.section||"—")+'</td><td>'+escapeHtml(s.parent||"—")+'<small style="display:block;color:var(--muted)">'+escapeHtml(s.phone||"No phone added")+'</small></td><td><span class="badge">'+escapeHtml(s.status||"Active")+'</span></td><td><div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="btn secondary" style="padding:6px 9px;font-size:12px" data-student-edit="'+escapeHtml(s.id)+'">Edit</button><button type="button" class="btn" style="padding:6px 9px;font-size:12px;background:#fff0f0;color:#b42318;border:1px solid #f5d0d0" data-student-delete="'+escapeHtml(s.id)+'">Delete</button></div></td></tr>').join("");
 if(!arr.length) rows='<tr><td colspan="6" class="empty">No students match this search. Add a student or try another search.</td></tr>';
 return '<section class="glass panel"><div class="pagehead"><div><h2 style="margin:0">Student management</h2><small style="color:var(--muted)">'+(records.Students||[]).length+' demo student records · Search by name, admission number, class, parent or contact</small></div><button class="btn" data-add="Students">＋ Add student</button></div><div class="tablewrap"><table class="data"><thead><tr><th>Student</th><th>Admission No.</th><th>Class</th><th>Parent / Contact</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+rows+'</tbody></table></div><p style="color:var(--muted);font-size:12px;margin:12px 0 0">Demo note: additions, edits and deletions are saved in this browser only. They are not visible to other users or devices.</p></section>';
}
function listPage(){let arr=records[page]||[],q=$('search').value.toLowerCase();arr=arr.filter(x=>(x.name+" "+x.detail+" "+x.status).toLowerCase().includes(q));let addable=!['Reports','Settings'].includes(page);let rows=arr.map((x,i)=>'<tr><td><b>'+escapeHtml(x.name)+'</b></td><td>'+escapeHtml(x.detail)+'</td><td><span class="badge">'+escapeHtml(x.status)+'</span></td></tr>').join('');return '<section class="glass panel"><div class="pagehead"><div><h2 style="margin:0">'+escapeHtml(page)+'</h2><small style="color:var(--muted)">Sample data · '+arr.length+' records shown</small></div>'+(addable?'<button class="btn" data-add="'+escapeHtml(page)+'">＋ Add '+escapeHtml(page==='Students'?'student':page==='Teachers'?'teacher':'record')+'</button>':'')+'</div><div class="tablewrap"><table class="data"><thead><tr><th>Name / Title</th><th>Details</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table>'+(arr.length?'':'<div class="empty">No matching demo records. Try another search or add a record.</div>')+'</div></section>'+(page==='Attendance'?'<section class="glass panel" style="margin-top:14px"><h2>Attendance demo</h2><p style="color:var(--muted)">This preview does not save real attendance. Add a demo entry above to try the interface.</p><button class="btn" data-add="Attendance">＋ Add attendance entry</button></section>':'')}
function render(){document.querySelectorAll('.nav[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('pagetitle').textContent=page==='Overview'?'School overview':page;$('content').innerHTML=page==='Overview'?overview():page==='Students'?studentPage():listPage();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;$('search').value='';render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openForm(b.dataset.add));document.querySelectorAll('[data-student-edit]').forEach(b=>b.onclick=()=>openStudentForm(b.dataset.studentEdit));document.querySelectorAll('[data-student-delete]').forEach(b=>b.onclick=()=>{const s=records.Students.find(x=>x.id===b.dataset.studentDelete);if(!s)return;if(confirm('Delete '+s.name+' from this browser demo? This cannot be undone.')){records.Students=records.Students.filter(x=>x.id!==s.id);saveRecords();render();}});let ai=$('askai');if(ai)ai.onclick=()=>alert('AI Assistant demo: Keep student records organized, review attendance daily, and communicate upcoming assessments to parents. Real AI requires configuring an API on the hosted Laravel backend.')}
function nextAdmissionNumber(){let max=0;(records.Students||[]).forEach(s=>{const m=String(s.admissionNo||"").match(/(\d+)$/);if(m)max=Math.max(max,Number(m[1]));});return "LAV-2026-"+String(max+1).padStart(3,"0");}
function studentField(name,label,type,value,required){return '<div class="field"><label for="student-'+name+'">'+label+'</label><input id="student-'+name+'" name="'+name+'" type="'+type+'" value="'+escapeHtml(value||"")+'" '+(required?'required':'')+' autocomplete="off"></div>';}
function openStudentForm(studentId){
 const s=studentId?records.Students.find(x=>x.id===studentId):null;
 if(studentId&&!s){alert("Student record not found.");return;}
 $('modalTitle').textContent=s?"Edit student details":"Add student";
 $('formfields').innerHTML=
  studentField("name","Student full name","text",s?s.name:"",true)+
  studentField("admissionNo","Admission number","text",s?s.admissionNo:nextAdmissionNumber(),true)+
  studentField("grade","Class / grade","text",s?s.grade:"Grade 1",true)+
  studentField("section","Section","text",s?s.section:"A",true)+
  studentField("parent","Parent / guardian name","text",s?s.parent:"",true)+
  studentField("phone","Parent contact number","tel",s?s.phone:"",true)+
  studentField("email","Parent email (optional)","email",s?s.email:"",false)+
  '<div class="field"><label for="student-status">Status</label><select id="student-status" name="status"><option '+((s?s.status:"Active")==="Active"?"selected":"")+'>Active</option><option '+((s?s.status:"")==="Inactive"?"selected":"")+'>Inactive</option><option '+((s?s.status:"")==="Pending"?"selected":"")+'>Pending</option></select></div>';
 $('recordForm').dataset.kind="Students";
 $('recordForm').dataset.editId=s?s.id:"";
 $('overlay').style.display='grid';
}
function openForm(kind){if(kind==="Students"){openStudentForm();return;}$('modalTitle').textContent='Add '+kind+' demo record';let fields=kind==='Attendance'?[['name','Class / section','text'],['detail','Attendance summary','text']]:kind==='Fees'?[['name','Student name','text'],['detail','Fee description and amount','text']]:[['name',kind==='Teachers'?'Teacher full name':'Record name','text'],['detail','Details','text']];$('formfields').innerHTML=fields.map(f=>'<div class="field"><label>'+f[1]+'</label><input required name="'+f[0]+'" type="'+f[2]+'" placeholder="'+f[1]+'"></div>').join('')+'<div class="field"><label>Status</label><select name="status"><option>Active</option><option>Pending</option><option>Paid</option><option>Recorded</option><option>Scheduled</option></select></div>'; $('recordForm').dataset.kind=kind;$('recordForm').dataset.editId='';$('overlay').style.display='grid'}
