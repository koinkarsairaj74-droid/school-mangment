<script>
const DEMO_FIRST_NAMES=["Aarav","Ananya","Vihaan","Saanvi","Aditya","Aadhya","Arjun","Isha","Reyansh","Myra","Atharv","Kavya","Vivaan","Diya","Advait","Sara","Ishaan","Riya","Shaurya","Aanya","Kabir","Pari","Rudra","Meera","Om","Tanvi","Dhruv","Nitya","Vedant","Siya"];
const DEMO_LAST_NAMES=["Patil","Shah","Joshi","Deshmukh","Kulkarni","Jadhav","Pawar","More","Shinde","Chavan","Gaikwad","Bhosale","Kadam","Mane","Sawant","Naik","Gokhale","Apte","Nair","Mehta","Gupta","Suryawanshi","Salunkhe","Ingale","Wagh","Thakur","Khot","Pathak","Patwardhan","Dandekar"];
const SECTION_TEACHERS={A:"Mrs. Meera Kulkarni",B:"Mr. Rahul Deshmukh",C:"Ms. Neha Shah",D:"Mr. Amit Jadhav"};
const ATTENDANCE_TEACHERS=[{name:"Mr. Rahul Deshmukh",subject:"Science"},{name:"Mrs. Meera Kulkarni",subject:"Mathematics"},{name:"Ms. Neha Shah",subject:"English"},{name:"Mr. Amit Jadhav",subject:"Social Science"},{name:"Mrs. Kavita Pawar",subject:"Marathi"},{name:"Mr. Sandeep More",subject:"Computer"}];
const ATTENDANCE_SUBJECTS=["Mathematics","Science","English","Social Science","Marathi","Hindi","Computer","Sports"];
const DEMO_SECTIONS=["A","B","C","D"];
function createAttendanceRoster(){
 const out=[];
 DEMO_SECTIONS.forEach((section,sectionIndex)=>{
  for(let i=0;i<30;i++){
   const first=DEMO_FIRST_NAMES[(i+sectionIndex*8)%DEMO_FIRST_NAMES.length];
   const last=DEMO_LAST_NAMES[(i*7+sectionIndex*9)%DEMO_LAST_NAMES.length];
   const number=String(i+1).padStart(3,"0");
   out.push({id:"demo-"+section+"-"+number,admissionNo:"LAV-"+section+"-"+number,name:first+" "+last,grade:"Class 8",section,parent:"Demo parent "+number,phone:"",email:"",detail:"Class 8 · "+section,status:"Active",demoRoster:true});
  }
 });
 return out;
}
const sample={Students:createAttendanceRoster(),Teachers:[{name:"Mrs. Meera Kulkarni",detail:"Mathematics",status:"Active"},{name:"Mr. Rahul Deshmukh",detail:"Science",status:"Active"},{name:"Ms. Neha Shah",detail:"English",status:"Active"}],Classes:[{name:"Grade 8 · Section A",detail:"Class teacher: Mrs. Kulkarni",status:"Active"},{name:"Grade 9 · Section B",detail:"Class teacher: Mr. Deshmukh",status:"Active"}],Attendance:[{name:"Grade 8 · A",detail:"24 present · 2 absent",status:"Recorded"},{name:"Grade 9 · B",detail:"27 present · 1 absent",status:"Recorded"}],Timetable:[{name:"Mathematics",detail:"Grade 8 · 09:00 AM",status:"Scheduled"},{name:"Science",detail:"Grade 9 · 10:00 AM",status:"Scheduled"}],"Exams & Marks":[{name:"Monthly Assessment",detail:"All grades",status:"Upcoming"},{name:"Unit Test 2",detail:"Grade 8",status:"Upcoming"}],Fees:[{name:"Aarav Patil",detail:"Tuition · ₹12,000",status:"Pending"},{name:"Ananya Shah",detail:"Tuition · ₹12,000",status:"Paid"}],Parents:[{name:"Sanjay Patil",detail:"Parent of Aarav Patil",status:"Active"}],Reports:[{name:"Attendance summary",detail:"Monthly report",status:"Ready"},{name:"Fees overview",detail:"Term report",status:"Ready"}],Settings:[{name:"School profile",detail:"Configure school information on your live app",status:"Demo"}]};
const STORE_KEY="lavsms-demo-records";
const ROSTER_MIGRATION_KEY="lavsms-demo-roster-v1";
const ATTENDANCE_STORE_KEY="lavsms-attendance-history-v1";
function loadRecords(){
 let merged=JSON.parse(JSON.stringify(sample));
 try{
  const raw=localStorage.getItem(STORE_KEY);
  if(raw){
   const saved=JSON.parse(raw);
   merged=Object.assign(JSON.parse(JSON.stringify(sample)),saved);
   if(localStorage.getItem(ROSTER_MIGRATION_KEY)!=="1"){
    const legacyIds=new Set(["STU001","STU002","STU003"]);
    const existing=Array.isArray(saved.Students)?saved.Students:[];
    const custom=existing.filter(s=>s&&s.id&&!legacyIds.has(s.id)&&!sample.Students.some(d=>d.id===s.id));
    merged.Students=sample.Students.concat(custom);
    localStorage.setItem(STORE_KEY,JSON.stringify(merged));
    localStorage.setItem(ROSTER_MIGRATION_KEY,"1");
   }
   merged.Students=(merged.Students||[]).map((s,i)=>{
    const parts=String(s.detail||"Class 8 · A").split(" · ");
    return Object.assign({id:"stu-"+(i+1),admissionNo:"LAV-2026-"+String(i+1).padStart(3,"0"),name:"",grade:"Class 8",section:"A",parent:"Not provided",phone:"",email:"",status:"Active"},s,{grade:s.grade||parts[0]||"Class 8",section:s.section||parts[1]||"A"});
   });
   return merged;
  }
  localStorage.setItem(ROSTER_MIGRATION_KEY,"1");
 }catch(err){console.warn("Could not read saved LAV SMS demo data",err);}
 return merged;
}

}

function compressAttendancePhoto(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onerror=()=>reject(new Error("Image could not be read"));
  reader.onload=()=>{
   const img=new Image();
   img.onerror=()=>reject(new Error("Invalid image"));
   img.onload=()=>{
    const maxSide=900,scale=Math.min(1,maxSide/Math.max(img.width,img.height));
    const canvas=document.createElement("canvas");
    canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
    const ctx=canvas.getContext("2d");if(!ctx){reject(new Error("Image compression unavailable"));return;}
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    resolve(canvas.toDataURL("image/jpeg",0.62));
   };
   img.src=reader.result;
  };
  reader.readAsDataURL(file);
 });
}

function certBulkOptions(){const students=records.Students||[];const grades=[...new Set(students.map(s=>String(s.grade||"")).filter(Boolean))].sort();const divisions=[...new Set(students.map(s=>String(s.section||"")).filter(Boolean))].sort();return '<div class="cert-bulk"><h3>Bulk Certificate Generator</h3><p class="cert-hint">Filter by class and division. Select students and assign each position; the main position sets the default.</p><div class="cert-fields"><div><label for="certBulkGrade">Class</label><select id="certBulkGrade"><option value="">All classes</option>'+grades.map(g=>'<option value="'+certEsc(g)+'">'+certEsc(g)+'</option>').join("")+'</select></div><div><label for="certBulkDivision">Division</label><select id="certBulkDivision"><option value="">All divisions</option>'+divisions.map(g=>'<option value="'+certEsc(g)+'">'+certEsc(g)+'</option>').join("")+'</select></div></div><div class="cert-fields" style="margin-top:12px"><div><label for="certBulkSearch">Search students to select</label><input id="certBulkSearch" type="search" placeholder="Name, admission number or class..." autocomplete="off"></div></div><div class="cert-buttons"><button class="btn secondary" type="button" id="certBulkAll">Select all filtered</button><button class="btn secondary" type="button" id="certBulkClear">Clear selection</button></div><div id="certBulkList" style="max-height:220px;overflow:auto;margin-top:12px"></div><p class="cert-hint" id="certBulkCount"></p><button class="btn" type="button" id="certBulkGenerate">Save &amp; Print Selected Certificates</button><p class="cert-hint">Each selected student gets a separate landscape page in one print/PDF job.</p></div>'}

function bindCertBulk(){const list=$("certBulkList"),grade=$("certBulkGrade"),division=$("certBulkDivision");if(!list)return;const filtered=()=> (records.Students||[]).filter(s=>(!grade.value||String(s.grade)===grade.value)&&(!division.value||String(s.section)===division.value)&&(!$("certBulkSearch")||[s.name,s.admissionNo,s.grade,s.section].join(" ").toLowerCase().includes($("certBulkSearch").value.trim().toLowerCase())));const paint=()=>{const matches=filtered();list.innerHTML=matches.map(s=>'<label style="display:flex;gap:8px;align-items:center;padding:7px;border-bottom:1px solid #e2e8f0"><input type="checkbox" data-cert-bulk-id="'+certEsc(s.id)+'" '+(certBulkSelected.has(String(s.id))?"checked":"")+'><span>'+certEsc(s.name)+' · '+certEsc(s.grade)+' / '+certEsc(s.section)+'</span><select data-cert-bulk-achievement="'+certEsc(s.id)+'" aria-label="Position for '+certEsc(s.name)+'" style="max-width:135px;border:1px solid #cbd5e1;border-radius:7px;padding:6px">'+certAchievementOptions(certBulkAchievements[String(s.id)]||certDraft.achievement)+'</select></label>').join("")||'<p class="cert-hint">No students match this filter.</p>';list.querySelectorAll("[data-cert-bulk-id]").forEach(box=>box.onchange=()=>{if(box.checked)certBulkSelected.add(box.dataset.certBulkId);else certBulkSelected.delete(box.dataset.certBulkId);count()});list.querySelectorAll("[data-cert-bulk-achievement]").forEach(sel=>sel.onchange=()=>{certBulkAchievements[sel.dataset.certBulkAchievement]=sel.value;certBulkSelected.add(sel.dataset.certBulkAchievement);paint()});count()};const count=()=>{$("certBulkCount").textContent=certBulkSelected.size+" student(s) selected · "+filtered().length+" matching filter"};grade.onchange=paint;division.onchange=paint;if($("certBulkSearch"))$("certBulkSearch").oninput=paint;$("certBulkAll").onclick=()=>{filtered().forEach(s=>certBulkSelected.add(String(s.id)));paint()};$("certBulkClear").onclick=()=>{certBulkSelected.clear();certBulkAchievements={};paint()};$("certBulkGenerate").onclick=()=>{if(!certDraft.competition.trim()||!certDraft.date){alert("Enter competition name and date first.");return;}const chosen=(records.Students||[]).filter(s=>certBulkSelected.has(String(s.id)));if(!chosen.length){alert("Select at least one student.");return;}if(chosen.length>120&&!confirm("Generate "+chosen.length+" certificate pages?"))return;const items=chosen.map((s,i)=>({...certData(),studentId:s.id,name:s.name,grade:s.grade,section:s.section,achievement:certBulkAchievements[String(s.id)]||certDraft.achievement||"Participation",id:"cert-"+Date.now()+"-"+i}));try{localStorage.setItem(CERT_KEY,JSON.stringify([...items,...certSaved()]));}catch(e){alert("Browser storage is full. Reduce the selection and retry.");return;}certPrintBulk(items);render()};paint()}

function nextAdmissionNumber(){let max=0;(records.Students||[]).forEach(s=>{const m=String(s.admissionNo||"").match(/(\d+)$/);if(m)max=Math.max(max,Number(m[1]));});return "LAV-2026-"+String(max+1).padStart(3,"0");}
