<script>
const DEMO_FIRST_NAMES=["Aarav","Ananya","Vihaan","Saanvi","Aditya","Aadhya","Arjun","Isha","Reyansh","Myra","Atharv","Kavya","Vivaan","Diya","Advait","Sara","Ishaan","Riya","Shaurya","Aanya","Kabir","Pari","Rudra","Meera","Om","Tanvi","Dhruv","Nitya","Vedant","Siya"];
const DEMO_LAST_NAMES=["Patil","Shah","Joshi","Deshmukh","Kulkarni","Jadhav","Pawar","More","Shinde","Chavan","Gaikwad","Bhosale","Kadam","Mane","Sawant","Naik","Gokhale","Apte","Nair","Mehta","Gupta","Suryawanshi","Salunkhe","Ingale","Wagh","Thakur","Khot","Pathak","Patwardhan","Dandekar"];
const SECTION_TEACHERS={A:"Mrs. Meera Kulkarni",B:"Mr. Rahul Deshmukh",C:"Ms. Neha Shah",D:"Mr. Amit Jadhav"};
const DEMO_SECTIONS=["A","B","C","D"];
function createAttendanceRoster(){
 const out=[];
 DEMO_SECTIONS.forEach((section,sectionIndex)=>{
  for(let i=0;i<30;i++){
   const first=DEMO_FIRST_NAMES[(i+sectionIndex*8)%DEMO_FIRST_NAMES.length];
   const last=DEMO_LAST_NAMES[(i*7+sectionIndex*9)%DEMO_LAST_NAMES.length];
   const number=String(i+1).padStart(3,"0");
   out.push({id:"demo-"+section+"-"+number,admissionNo:"LAV-"+section+"-"+number,name:first+" "+last,grade:"Class 8",section,parent:"Demo parent "+number,phone:"",email:"",detail:"Class 8 · "+section,status:"Active",demoRoster:true});
  }
 });
 return out;
}
const sample={Students:createAttendanceRoster(),Teachers:[{name:"Mrs. Meera Kulkarni",detail:"Mathematics",status:"Active"},{name:"Mr. Rahul Deshmukh",detail:"Science",status:"Active"},{name:"Ms. Neha Shah",detail:"English",status:"Active"}],Classes:[{name:"Grade 8 · Section A",detail:"Class teacher: Mrs. Kulkarni",status:"Active"},{name:"Grade 9 · Section B",detail:"Class teacher: Mr. Deshmukh",status:"Active"}],Attendance:[{name:"Grade 8 · A",detail:"24 present · 2 absent",status:"Recorded"},{name:"Grade 9 · B",detail:"27 present · 1 absent",status:"Recorded"}],Timetable:[{name:"Mathematics",detail:"Grade 8 · 09:00 AM",status:"Scheduled"},{name:"Science",detail:"Grade 9 · 10:00 AM",status:"Scheduled"}],"Exams & Marks":[{name:"Monthly Assessment",detail:"All grades",status:"Upcoming"},{name:"Unit Test 2",detail:"Grade 8",status:"Upcoming"}],Fees:[{name:"Aarav Patil",detail:"Tuition · ₹12,000",status:"Pending"},{name:"Ananya Shah",detail:"Tuition · ₹12,000",status:"Paid"}],Parents:[{name:"Sanjay Patil",detail:"Parent of Aarav Patil",status:"Active"}],Reports:[{name:"Attendance summary",detail:"Monthly report",status:"Ready"},{name:"Fees overview",detail:"Term report",status:"Ready"}],Settings:[{name:"School profile",detail:"Configure school information on your live app",status:"Demo"}]};
const STORE_KEY="lavsms-demo-records";
const ROSTER_MIGRATION_KEY="lavsms-demo-roster-v1";
const ATTENDANCE_STORE_KEY="lavsms-attendance-history-v1";
function loadRecords(){
 let merged=JSON.parse(JSON.stringify(sample));
 try{
  const raw=localStorage.getItem(STORE_KEY);
  if(raw){
   const saved=JSON.parse(raw);
   merged=Object.assign(JSON.parse(JSON.stringify(sample)),saved);
   if(localStorage.getItem(ROSTER_MIGRATION_KEY)!=="1"){
    const legacyIds=new Set(["STU001","STU002","STU003"]);
    const existing=Array.isArray(saved.Students)?saved.Students:[];
    const custom=existing.filter(s=>s&&s.id&&!legacyIds.has(s.id)&&!sample.Students.some(d=>d.id===s.id));
    merged.Students=sample.Students.concat(custom);
    localStorage.setItem(STORE_KEY,JSON.stringify(merged));
    localStorage.setItem(ROSTER_MIGRATION_KEY,"1");
   }
   merged.Students=(merged.Students||[]).map((s,i)=>{
    const parts=String(s.detail||"Class 8 · A").split(" · ");
    return Object.assign({id:"stu-"+(i+1),admissionNo:"LAV-2026-"+String(i+1).padStart(3,"0"),name:"",grade:"Class 8",section:"A",parent:"Not provided",phone:"",email:"",status:"Active"},s,{grade:s.grade||parts[0]||"Class 8",section:s.section||parts[1]||"A"});
   });
   return merged;
  }
  localStorage.setItem(ROSTER_MIGRATION_KEY,"1");
 }catch(err){console.warn("Could not read saved LAV SMS demo data",err);}
 return merged;
}
let records=loadRecords(),page="Overview";
function saveRecords(){try{localStorage.setItem(STORE_KEY,JSON.stringify(records));return true;}catch(err){alert("This browser could not save the demo data. Try allowing site storage or using a normal browser window.");return false;}}
function todayLocal(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
let attendanceDraft={section:"A",date:todayLocal(),lecture:"",statuses:{},photoData:"",photoName:""};
function loadAttendanceSessions(){try{const rows=JSON.parse(localStorage.getItem(ATTENDANCE_STORE_KEY)||"[]");return Array.isArray(rows)?rows:[];}catch(err){return [];}}
function attendanceRosterForCurrentSection(){return (records.Students||[]).filter(s=>s.section===attendanceDraft.section&&s.grade==="Class 8"&&(s.demoRoster||String(s.id||"").startsWith("demo-"))).sort((a,b)=>String(a.admissionNo).localeCompare(String(b.admissionNo)));}
const $=id=>document.getElementById(id);
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(title,body){return '<section class="glass panel"><div class="sectionhead" style="margin-top:0"><h2>'+title+'</h2></div>'+body+'</section>'}
function overview(){return '<section class="glass welcome"><div><div class="eyebrow">YOUR SCHOOL AT A GLANCE</div><h2>Good day, Administrator 👋</h2><p>Explore your school dashboard and try the demo actions.</p></div><div class="cap">🎓</div></section><div class="sectionhead"><h2>School statistics</h2><small>Illustrative preview data</small></div><section class="stats"><div class="glass stat"><div class="statlabel">Total students <span class="staticon">♙</span></div><div class="num">'+records.Students.length+'</div><div class="sub">Demo student records</div></div><div class="glass stat"><div class="statlabel">Teaching staff <span class="staticon">♧</span></div><div class="num">'+records.Teachers.length+'</div><div class="sub">Demo teacher records</div></div><div class="glass stat"><div class="statlabel">Classes today <span class="staticon">▤</span></div><div class="num">'+records.Classes.length+'</div><div class="sub">Demo classes</div></div><div class="glass stat"><div class="statlabel">Fee records <span class="staticon">₹</span></div><div class="num">'+records.Fees.length+'</div><div class="sub">No real payments processed</div></div></section><div class="twocol"><div><div class="sectionhead"><h2>Quick actions</h2><small>Try the interface</small></div><section class="glass panel"><div class="quickgrid"><button class="quick" data-add="Students"><span class="qico">＋</span><span><b>Add a student</b><small>Try adding a demo record</small></span></button><button class="quick" data-page="Attendance"><span class="qico">✓</span><span><b>Take attendance</b><small>Open attendance section</small></span></button><button class="quick" data-page="Timetable"><span class="qico">◷</span><span><b>View timetable</b><small>Classes and schedule</small></span></button><button class="quick" data-page="Reports"><span class="qico">▥</span><span><b>View reports</b><small>Demo report list</small></span></button></div></section><section class="glass assistant"><div class="bot">✦</div><div><b>AI school assistant</b><p>Ask for a sample school admin tip.</p></div><button class="btn" id="askai">Try assistant</button></section></div><div><div class="sectionhead"><h2>Upcoming schedule</h2><small>Example events</small></div>'+card('School calendar','<div class="event"><div class="date">27<br>OCT</div><div><b>Faculty meeting</b><small>Staff room · 10:30 AM</small></div></div><div class="event"><div class="date">29<br>OCT</div><div><b>Monthly assessment</b><small>All classes · As scheduled</small></div></div><div class="event"><div class="date">02<br>NOV</div><div><b>Parent-teacher meeting</b><small>Main hall · 9:00 AM</small></div></div>')+'</div></div>'}
function studentPage(){
 let q=$("search").value.trim().toLowerCase();

function attendanceCounts(){
 const roster=attendanceRosterForCurrentSection();
 let present=0,absent=0;
 roster.forEach(s=>{if(attendanceDraft.statuses[s.id]==="P")present++;else if(attendanceDraft.statuses[s.id]==="A")absent++;});
 return {total:roster.length,present,absent,unmarked:roster.length-present-absent,roster};
}
function paintAttendanceState(){
 if(page!=="Attendance")return;
 const counts=attendanceCounts();
 if($("attTotal"))$("attTotal").textContent=counts.total;
 if($("attPresent"))$("attPresent").textContent=counts.present;
 if($("attAbsent"))$("attAbsent").textContent=counts.absent;
 if($("attUnmarked"))$("attUnmarked").textContent=counts.unmarked;
 document.querySelectorAll("[data-att-student]").forEach(button=>{
  const selected=attendanceDraft.statuses[button.dataset.attStudent]||"";
  const own=button.dataset.attStatus;
  button.classList.toggle("is-present",selected==="P"&&own==="P");
  button.classList.toggle("is-absent",selected==="A"&&own==="A");
  button.setAttribute("aria-pressed",String(selected===own));
 });
 if($("attendanceSaveHint")){
  $("attendanceSaveHint").textContent=counts.unmarked===0
   ?"All "+counts.total+" students are marked. Confirm lecture and upload the required photo."
   :"Choose a lecture, mark all "+counts.total+" students Present or Absent ("+counts.unmarked+" still unmarked), and upload a class photo.";
 }
}

function resetAttendanceSheet(changes){

   paintAttendanceState();
  }catch(err){console.error(err);attendanceDraft.photoData="";attendanceDraft.photoName="";photoInput.value="";alert("That photo could not be processed. Please choose another image.");}
 };

function compressAttendancePhoto(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onerror=()=>reject(new Error("Image could not be read"));
  reader.onload=()=>{
   const img=new Image();
   img.onerror=()=>reject(new Error("Invalid image"));
   img.onload=()=>{
    const maxSide=900,scale=Math.min(1,maxSide/Math.max(img.width,img.height));
    const canvas=document.createElement("canvas");
    canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
    const ctx=canvas.getContext("2d");if(!ctx){reject(new Error("Image compression unavailable"));return;}
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    resolve(canvas.toDataURL("image/jpeg",0.62));
   };
   img.src=reader.result;
  };
  reader.readAsDataURL(file);
 });
}

  console.error(err);
  alert("The browser could not store this attendance record. Try uploading a smaller photo or clearing old demo data.");
 }
}
